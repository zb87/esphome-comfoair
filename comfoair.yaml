substitutions:
  name: "comfoair"
  friendly_name: "ComfoAir"
  log_level: "INFO"

packages:
  base: !include config/base.yaml
  device: !include config/esp32-s3-n16r8.yaml
  bluetooth_proxy: !include config/bluetooth-proxy.yaml
  comfoair: !include config/comfoair-base.yaml
  led_status: !include config/led-status.yaml
  fan_boost: !include config/fan-boost.yaml
  # Optional packages
  # with_mac_suffix: !include config/with-mac-suffix.yaml
  # disable_auto_reboot: !include config/disable-auto-reboot.yaml
  # wireguard: !include config/wireguard.yaml
  # tailscale: !include config/tailscale.yaml
  # tailscale_debug: !include config/tailscale-debug.yaml
  # ptx_yk1_button: !include config/ptx-yk1-button.yaml
  # ptx_yk1_xiaomi_button: !include config/ptx-yk1-xiaomi-button.yaml
  # with_preset_wifi: !include config/base-with-preset-wifi.yaml
  # debug: !include config/debug.yaml
  # debug_psram: !include config/debug-psram.yaml

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    id: boot_button
    name: "Boot Button"
    internal: true
    on_click:
      - min_length: 50ms
        max_length: 1500ms
        then:
          - logger.log:
              level: INFO
              format: "Boot button clicked -> Starting Fan High Boost"
          - script.execute: start_boost
      - min_length: 5000ms
        max_length: 15000ms
        then:
          - script.stop: show_led_status
          - script.stop: on_wifi_connect
          - script.stop: indicate_level
          - logger.log: "Boot Button long pressed: Show RED LED for 5s, then perform factory reset"
          - light.turn_on:
              id: rgb_status_led
              red: 100%
              green: 0%
              blue: 0%
          - delay: 5s
          - button.press: factory_reset_btn
