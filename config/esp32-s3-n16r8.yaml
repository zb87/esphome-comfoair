packages:
  base: !include esp32-s3-base.yaml

esp32:
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "8192"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: y

psram:
  mode: octal
  speed: 80MHz